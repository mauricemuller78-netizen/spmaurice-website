name: Convert Mora clip

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Convert MOV to browser-friendly MP4
        run: |
          if [ -f "images/Timeline 1.mov" ] && [ ! -f "images/Timeline 1.mp4" ]; then
            ffmpeg -y -i "images/Timeline 1.mov" -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "images/Timeline 1.mp4"
          fi
      - name: Commit converted video
        run: |
          if [ -f "images/Timeline 1.mp4" ] && ! git ls-files --error-unmatch "images/Timeline 1.mp4" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "images/Timeline 1.mp4"
            git commit -m "Convert Mora clip to MP4"
            git push
          fi
