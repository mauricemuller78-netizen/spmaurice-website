<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Gilberto Mora heatmap">
  <defs>
    <clipPath id="pitchClip"><rect x="42" y="42" width="1116" height="636" rx="24"/></clipPath>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="pitchBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c18"/>
      <stop offset="1" stop-color="#0d1310"/>
