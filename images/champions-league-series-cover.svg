<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SPMaurice Champions League Series</title>
<desc id="desc">Dark green editorial football graphic with a tactical pitch and European competition theme.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#07100c"/>
    <stop offset="1" stop-color="#102117"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="45%" r="60%">
    <stop offset="0" stop-color="#a8df7a" stop-opacity=".16"/>
    <stop offset="1" stop-color="#a8df7a" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#glow)"/>

<g opacity=".5" stroke="#355143" fill="none" stroke-width="3">
  <rect x="860" y="110" width="610" height="680" rx="10"/>
  <line x1="1165" y1="110" x2="1165" y2="790"/>
  <circle cx="1165" cy="450" r="95"/>
  <rect x="860" y="280" width="120" height="340"/>
  <rect x="1350" y="280" width="120" height="340"/>
  <circle cx="1165" cy="450" r="7" fill="#a8df7a" stroke="none"/>
</g>

<g fill="#a8df7a">
  <circle cx="1000" cy="260" r="11"/><circle cx="1120" cy="330" r="11"/><circle cx="1280" cy="270" r="11"/>
  <circle cx="1060" cy="450" r="11"/><circle cx="1260" cy="455" r="11"/><circle cx="980" cy="610" r="11"/>
  <circle cx="1160" cy="610" r="11"/><circle cx="1340" cy="605" r="11"/>
</g>
<g stroke="#a8df7a" stroke-width="3" fill="none" opacity=".45" stroke-dasharray="9 13">
  <path d="M1000 260 C1040 300 1080 315 1120 330"/>
  <path d="M1120 330 C1170 360 1220 300 1280 270"/>
  <path d="M1060 450 C1110 420 1200 420 1260 455"/>
  <path d="M980 610 C1040 590 1100 600 1160 610"/>
  <path d="M1160 610 C1220 600 1290 590 1340 605"/>
</g>

<g font-family="Inter,Arial,sans-serif">
  <text x="110" y="170" fill="#a8df7a" font-size="28" font-weight="700" letter-spacing="7">SPMAURICE SERIES</text>
  <text x="110" y="310" fill="#f3f3ed" font-size="92" font-weight="800" letter-spacing="-4">CHAMPIONS</text>
  <text x="110" y="405" fill="#f3f3ed" font-size="92" font-weight="800" letter-spacing="-4">LEAGUE</text>
  <text x="110" y="500" fill="#f3f3ed" font-size="92" font-weight="800" letter-spacing="-4">SERIES</text>
