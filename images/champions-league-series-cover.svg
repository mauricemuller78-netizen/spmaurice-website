  <text x="110" y="660" fill="#9cab9f" font-size="30">One tactical archive.</text>
  <text x="110" y="760" fill="#6f8173" font-size="22" letter-spacing="3">TACTICS · STRUCTURE · PRESSING · ROLES</text>
